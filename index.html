<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Slides</title>
<style>
  html, body {
    margin: 0; height: 100%; background: #000; overflow: hidden;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none;
  }
  /* The stage is a fixed 1280x720 canvas. It is scaled (and rotated on phones)
     to fit the screen, so link positions are identical on every device. */
  #stage {
    position: absolute; left: 50%; top: 50%;
    width: 1280px; height: 720px;
    transform-origin: center center;
    background: #000;
  }
  .slide { position: absolute; inset: 0; display: none; }
  .slide.active { display: block; }
  .slide img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
  .link {
    position: absolute; display: block; z-index: 10; cursor: pointer;
    color: #43acee; font: 18px/1.2 sans-serif; text-shadow: 0 0 3px #000, 0 0 3px #000;
    text-decoration: underline; overflow: hidden;
  }
</style>
</head>
<body>
<div id="stage"></div>

<script>
/* ============ EDIT THIS ============
   file: the gif for that slide
   links: x, y, w, h are in STAGE pixels (stage is 1280 x 720, top-left = 0,0)
          href: where it goes
   Add as many links per slide as you want.                                  */
const SLIDES = [
  { file: "page1.gif", },
  { file: "page2.gif", links: [
    { x: 1040, y: 215, w: 200, h: 60, href: "https://obeygiant.com/about/", label: "About OBEY" },
    { x: 1040, y: 187, w: 200, h: 60, href: "https://www.malwarebytes.com/blog/privacy/2026/09/flock-cameras-are-tracking-people-as-well-as-cars", label: "Flock" },
    { x: 240, y: 290, w: 200, h: 60, href: "https://www.sciencedirect.com/science/article/pii/S0966692324000267?via%3Dihub", label: "broadly why cars suck" },
  ] },
  { file: "page3.gif", },
  { file: "page4.gif", links: [
    { x: 1000, y: 340, w: 200, h: 60, href: "https://www.ledbydonkeys.org/", label: "Led By Donkeys" },
    { x: 200, y: 340, w: 200, h: 60, href: "https://thisisindecline.com/press", label: "indecline" },
  ] },
  { file: "page5.gif", links: [
    { x: 320, y: 365, w: 200, h: 60, href: "https://digitalscholarship.tnstate.edu/cgi/viewcontent.cgi?article=1071&context=creating_change", label: "Defining Graffiti Art and Street Art as a Movement" },
    { x: 640, y: 655, w: 200, h: 60, href: "https://bombmagazine.org/articles/2018/06/28/sending-out-the-signal-swoon-interviewed/", label: "Interview with Swoon" },
  ] },
  { file: "page6.gif", }
];
const STAGE_W = 1280, STAGE_H = 720;

const LOOP_SLIDES = false; // true = last slide wraps back to the first
/* =================================== */

const stage = document.getElementById("stage");
let rotated = false;
let current = 0;

// build slides
const els = SLIDES.map((s) => {
  const d = document.createElement("div");
  d.className = "slide";
  const img = document.createElement("img");
  img.alt = "";
  img.draggable = false;
  d.appendChild(img);
  (s.links || []).forEach((l) => {
    const a = document.createElement("a");
    a.className = "link";
    a.href = l.href;
    a.style.left = l.x + "px"; a.style.top = l.y + "px";
    a.style.width = l.w + "px"; a.style.height = l.h + "px";
    a.setAttribute("aria-label", l.label || "link");
    a.textContent = l.label || "link";
    if (/^https?:/.test(l.href)) { a.target = "_blank"; a.rel = "noopener"; }
    d.appendChild(a);
  });
  stage.appendChild(d);
  return { d, img, src: s.file };
});

// preload all gifs so playback starts instantly
SLIDES.forEach((s) => { const i = new Image(); i.src = s.file; });

function show(n) {
  if (LOOP_SLIDES) n = (n + els.length) % els.length;
  n = Math.max(0, Math.min(els.length - 1, n));
  els[current].d.classList.remove("active");
  els[current].img.removeAttribute("src");     // stop the old one
  current = n;
  const e = els[current];
  e.img.src = e.src;                            // re-assigning src restarts the gif from frame 1 (served from cache)
  e.d.classList.add("active");
  history.replaceState(null, "", "#" + (current + 1));
}

// scale to fit; on phones held upright, rotate to landscape
function layout() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const touch = matchMedia("(pointer: coarse)").matches;
  rotated = touch && vh > vw;
  const availW = rotated ? vh : vw;
  const availH = rotated ? vw : vh;
  const s = Math.min(availW / STAGE_W, availH / STAGE_H);
  stage.style.transform =
    "translate(-50%, -50%) " + (rotated ? "rotate(90deg) " : "") + "scale(" + s + ")";
}
window.addEventListener("resize", layout);
window.addEventListener("orientationchange", layout);
layout();

// keyboard
window.addEventListener("keydown", (e) => {
  if (["ArrowRight", "ArrowDown", "PageDown", " "].includes(e.key)) { show(current + 1); e.preventDefault(); }
  else if (["ArrowLeft", "ArrowUp", "PageUp"].includes(e.key)) { show(current - 1); e.preventDefault(); }
  else if (e.key === "Home") show(0);
  else if (e.key === "End") show(els.length - 1);
});

// touch swipe (direction follows the stage, so it still feels right when rotated)
let t0 = null;
window.addEventListener("touchstart", (e) => { const t = e.touches[0]; t0 = { x: t.clientX, y: t.clientY }; }, { passive: true });
window.addEventListener("touchend", (e) => {
  if (!t0) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - t0.x, dy = t.clientY - t0.y;
  t0 = null;
  const along = rotated ? -dy : dx;       // movement along the stage's horizontal axis
  const across = rotated ? dx : dy;
  if (Math.abs(along) > 40 && Math.abs(along) > Math.abs(across)) show(current + (along < 0 ? 1 : -1));
}, { passive: true });

// start on #N if given
const start = parseInt(location.hash.slice(1), 10);
show(start > 0 && start <= els.length ? start - 1 : 0);
</script>
</body>
</html>
